[package]
name = "ainone-ui"
version = "0.1.0"
description = "Agent in One — 统一多 harness 的 ACP 桌面客户端"
authors = ["zhubaoduo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ainone_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.6"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
tauri-plugin-dialog = "2.7.3"
log = "0.4.34"
tauri-plugin-log = "2.9.1"
# P8 F-8-7 快问：Rust 侧发 OpenAI 兼容 chat/completions（密钥不暴露给 WebView，DEC-20）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
