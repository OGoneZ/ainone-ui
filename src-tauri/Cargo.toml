[package]
name = "ainone-ui"
version = "0.1.0"
description = "Agent in One — 统一多 harness 的 ACP 桌面客户端"
authors = ["zhubaoduo"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "ainone_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
# P32 F-32-1 系统通知（turn 完成/权限等待提醒）+ F-32-3 自动更新
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
# P29 任务三配置合并写：serde_json preserve_order 保键序（只改指定键不重排用户配置）；
# toml_edit 格式保留式 TOML 编辑（codex config.toml 用户注释不丢，Cargo 官方同款）
toml_edit = "0.22"
tauri-plugin-shell = "2.3.6"
tokio = { version = "1.53.1", features = ["process", "io-util", "rt-multi-thread", "sync", "macros", "time"] }
tauri-plugin-dialog = "2.7.3"
log = "0.4.34"
tauri-plugin-log = "2.9.1"
# P8 F-8-7 快问：Rust 侧发 OpenAI 兼容 chat/completions（密钥不暴露给 WebView，DEC-20）
# stream feature：P27 快问改 SSE 流式（bytes_stream 逐块解析 delta）
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
# P22 快问自动取 harness settings：解析 ~/.codex/config.toml（TOML）与家目录定位
toml = "0.8"
dirs = "5"
# P27 快问 SSE 流式：bytes_stream 返回的 Stream 用 futures-util 收割
futures-util = { version = "0.3", default-features = false, features = ["std"] }
# P31 内嵌 bun 清单 sha256 校验（诊断路径）
sha2 = "0.10"
# P32 R8：子进程输出 IPC base64 编码——Tauri v2 事件通道（Channel）无二进制支持，
# Vec<u8> 默认 serde_json 序列化为 number[]（每字节 ~4 字符），base64 字符串
# ~1.33 字符/字节，终端/harness 大输出场景序列化体积与前端解析开销降 ~3 倍
base64 = "0.22"

# 前端调试桥（P19c）：W3C WebDriver 内嵌服务，AI agent 经 HTTP 直驱 WebView
# （execute JS / 截图 / 元素查询）。optional + feature 控制：
#   dev 默认开（tauri.conf.json build.features 含 "webdriver"）；
#   打包用 tauri.dist.conf.json 覆盖（features 为空）→ release 完全不含此依赖。
tauri-plugin-webdriver = { version = "0.2", optional = true }
portable-pty = "0.9"
# P35 白屏自愈：web-process-crashed 信号监听（webview_resilience.rs）。
# 仅 Linux 有效；版本必须与 wry 内部依赖一致（Cargo.lock 已锁定 2.0.2），
# 否则 with_webview 返回的类型会对不上——升级 tauri/wry 时同步检查。
[target.'cfg(target_os = "linux")'.dependencies]
webkit2gtk = "2.0.2"

[features]
webdriver = ["dep:tauri-plugin-webdriver"]
